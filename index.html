<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Acupoint AR System</title>
  
  <!-- 載入 MediaPipe 官方 JS 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    video { 
      display: none; 
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // 自動適應手機螢幕高解析度
    function resizeCanvas() {
      canvasElement.width = window.innerWidth * (window.devicePixelRatio || 1);
      canvasElement.height = window.innerHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 自適應平滑歷史紀錄
    const smoothDict = {};

    function adaptiveSmoothPoint(name, x, y, alphaMin = 0.1, alphaMax = 0.9, k = 0.05) {
      if (!smoothDict[name]) {
        smoothDict[name] = { x, y };
        return { x, y };
      }
      const ox = smoothDict[name].x;
      const oy = smoothDict[name].y;
      const d = Math.sqrt((x - ox) ** 2 + (y - oy) ** 2);
      const dynamicAlpha = alphaMin + (alphaMax - alphaMin) * Math.exp(-k * d);
      
      const nx = Math.round(dynamicAlpha * ox + (1 - dynamicAlpha) * x);
      const ny = Math.round(dynamicAlpha * oy + (1 - dynamicAlpha) * y);

      smoothDict[name] = { x: nx, y: ny };
      return { x: nx, y: ny };
    }

    function onResults(results) {
      const cw = canvasElement.width;
      const ch = canvasElement.height;
      
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, cw, ch);

      if (!results.image) {
        canvasCtx.restore();
        return;
      }

      const vw = results.image.width;
      const vh = results.image.height;

      // 自動計算 Cover 比例，徹底解決「畫面扁扁變形」問題
      const canvasAspect = cw / ch;
      const imgAspect = vw / vh;

      let renderW, renderH, offsetX, offsetY;

      if (imgAspect > canvasAspect) {
        renderH = ch;
        renderW = vw * (ch / vh);
        offsetX = (cw - renderW) / 2;
        offsetY = 0;
      } else {
        renderW = cw;
        renderH = vh * (cw / vw);
        offsetX = 0;
        offsetY = (ch - renderH) / 2;
      }

      // 水平鏡像翻轉繪製
      canvasCtx.translate(cw, 0);
      canvasCtx.scale(-1, 1);

      // 繪製畫面 (保證不拉伸變形)
      canvasCtx.drawImage(results.image, cw - offsetX - renderW, offsetY, renderW, renderH);

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          
          // 繪製 3D FaceMesh 網格
          canvasCtx.save();
          canvasCtx.translate(cw - offsetX - renderW, offsetY);
          canvasCtx.scale(renderW / cw, renderH / ch);

          drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C040', lineWidth: 1});
          drawConnectors(canvasCtx, landmarks, FACEMESH_CONTOURS, {color: '#00FFCC70', lineWidth: 1.2});
          canvasCtx.restore();

          // 校正後的座標計算
          const getPt = (idx) => ({
            x: Math.round(offsetX + landmarks[idx].x * renderW),
            y: Math.round(offsetY + landmarks[idx].y * renderH)
          });

          // 剛性穴位幾何計算
          const yintang = getPt(6);
          const qingming_L = getPt(133), qingming_R = getPt(362);
          const zanzhu_L = getPt(55), zanzhu_R = getPt(285);
          const yuyao_L = getPt(105), yuyao_R = getPt(334);

          const in_L = getPt(133), out_L = getPt(33);
          const tongzi_L = {
            x: Math.round(out_L.x + 0.35 * (out_L.x - in_L.x)),
            y: Math.round(out_L.y + 0.35 * (out_L.y - in_L.y))
          };

          const in_R = getPt(362), out_R = getPt(263);
          const tongzi_R = {
            x: Math.round(out_R.x + 0.35 * (out_R.x - in_R.x)),
            y: Math.round(out_R.y + 0.35 * (out_R.y - in_R.y))
          };

          const nose = getPt(1);
          const cL_x = (in_L.x + out_L.x) / 2, cL_y = (in_L.y + out_L.y) / 2;
          const sibai_L = {
            x: Math.round(cL_x),
            y: Math.round(cL_y + (nose.y - cL_y) * 0.45)
          };

          const cR_x = (in_R.x + out_R.x) / 2, cR_y = (in_R.y + out_R.y) / 2;
          const sibai_R = {
            x: Math.round(cR_x),
            y: Math.round(cR_y + (nose.y - cR_y) * 0.45)
          };

          // 繪製標籤與紅點
          const drawPoint = (name, label, pt) => {
            const smoothed = adaptiveSmoothPoint(name, pt.x, pt.y);

            // 1. 外層紅光暈
            canvasCtx.beginPath();
            canvasCtx.arc(smoothed.x, smoothed.y, 8, 0, 2 * Math.PI);
            canvasCtx.fillStyle = 'rgba(255, 0, 85, 0.35)';
            canvasCtx.fill();

            // 2. 核心紅色圓點
            canvasCtx.beginPath();
            canvasCtx.arc(smoothed.x, smoothed.y, 4, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#FF0055';
            canvasCtx.fill();

            // 3. 白色外框線
            canvasCtx.lineWidth = 1.5;
            canvasCtx.strokeStyle = '#FFFFFF';
            canvasCtx.stroke();

            // 4. 文字標籤 (反向鏡像以防文字顛倒)
            canvasCtx.save();
            canvasCtx.translate(smoothed.x, smoothed.y);
            canvasCtx.scale(-1, 1);

            const fontSize = Math.max(12, Math.round(cw * 0.015));
            canvasCtx.font = `bold ${fontSize}px Arial, sans-serif`;
            const textWidth = canvasCtx.measureText(label).width;

            // 半透明黑底氣泡膠囊
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            canvasCtx.beginPath();
            canvasCtx.roundRect(-textWidth / 2 - 6, -fontSize - 12, textWidth + 12, fontSize + 6, 4);
            canvasCtx.fill();

            // 亮青色字體
            canvasCtx.fillStyle = '#00FFCC';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText(label, 0, -10);
            canvasCtx.restore();
          };

          drawPoint("yintang", "Yintang", yintang);
          drawPoint("qL", "Qingming_L", qingming_L);
          drawPoint("qR", "Qingming_R", qingming_R);
          drawPoint("zL", "Zanzhu_L", zanzhu_L);
          drawPoint("zR", "Zanzhu_R", zanzhu_R);
          drawPoint("yL", "Yuyao_L", yuyao_L);
          drawPoint("yR", "Yuyao_R", yuyao_R);
          drawPoint("tL", "Tongziliao_L", tongzi_L);
          drawPoint("tR", "Tongziliao_R", tongzi_R);
          drawPoint("sL", "Sibai_L", sibai_L);
          drawPoint("sR", "Sibai_R", sibai_R);
        }
      }
      canvasCtx.restore();
    }

    // 初始化 FaceMesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    videoElement.muted = true;
    videoElement.autoplay = true;
    videoElement.setAttribute('playsinline', '');

    let isProcessing = false;

    async function startWebViewCamera() {
      const constraints = {
        video: {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleStream(stream);
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          handleStream(fallbackStream);
        } catch (finalErr) {
          console.error("相機存取失敗:", finalErr);
        }
      }
    }

    function handleStream(stream) {
      if ('srcObject' in videoElement) {
        videoElement.srcObject = stream;
      } else {
        videoElement.src = window.URL.createObjectURL(stream);
      }
      videoElement.play().then(() => {
        requestAnimationFrame(processFrame);
      }).catch(e => console.error("視訊播放失敗:", e));
    }

    async function processFrame() {
      if (!videoElement.paused && !videoElement.ended && videoElement.readyState >= 2) {
        if (!isProcessing) {
          isProcessing = true;
          await faceMesh.send({ image: videoElement });
          isProcessing = false;
        }
      }
      requestAnimationFrame(processFrame);
    }

    startWebViewCamera();
  </script>
</body>
</html>
